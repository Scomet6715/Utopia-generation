<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>门票生成</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 12px;
      margin: 0;
      background: #fafafa;
      color: #222;
    }
    h2 { font-size: 20px; margin: 8px 0; }
    p { font-size: 13px; color: #666; margin: 6px 0 12px; }
    code { background: #eee; padding: 1px 4px; border-radius: 3px; font-size: 12px; }

    .status {
      margin: 10px 0;
      padding: 8px 12px;
      background: #f0f0f0;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 14px 0;
    }
    .controls label {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
    }
    input[type="number"] {
      padding: 6px;
      font-size: 15px;
      width: 72px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 14px;
      font-size: 15px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
    }
    button.danger { background: #dc3545; }

    #qrcode-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
      justify-content: center;
    }
    .ticket {
      text-align: center;
      border: 1px solid #ddd;
      padding: 8px;
      border-radius: 8px;
      background: #fff;
      flex: 0 0 auto;
      max-width: 100%;
    }
    .ticket canvas,
    .ticket img {
      display: block;
      max-width: 100%;
      height: auto;
      margin: 0 auto;
    }
    .ticket-label {
      margin-top: 6px;
      font-size: 13px;
      color: #333;
      font-weight: bold;
      white-space: nowrap;
    }

    @media (max-width: 480px) {
      body { padding: 10px; }
      h2 { font-size: 18px; }
      .controls { gap: 8px; }
      input[type="number"] { width: 64px; font-size: 14px; }
      button { padding: 7px 12px; font-size: 14px; }
      #qrcode-container { gap: 10px; }
      .ticket { padding: 6px; }
      .ticket-label { font-size: 12px; }
    }
  </style>
</head>
<body>
  <h2>生成门票二维码</h2>
  <p>票号格式：<code>Utopia_yymmdd_001</code>，二维码内为加密后的密文。</p>

  <div class="status" id="status"></div>

  <div class="controls">
    <label>今日起始编号：<input type="number" id="startNum" value="1" min="1" max="999"></label>
    <label>生成数量：<input type="number" id="count" value="5" min="1" max="200"></label>
    <button onclick="generateTickets()">生成</button>
    <button class="danger" onclick="resetCounter()">重置今日计数器</button>
  </div>

  <div id="qrcode-container"></div>

  <script>
    const COUNTER_KEY = 'ticket_counter_v1';
    const SECRET_KEY = 'Utopia_QQ_XG_AT_6715'; // 必须与核销页一致

    // ---- 加密：XOR + Base64 ----
    function encrypt(text) {
      const encoder = new TextEncoder();
      const bytes = encoder.encode(text);
      const keyBytes = encoder.encode(SECRET_KEY);
      const encrypted = new Uint8Array(bytes.length);
      for (let i = 0; i < bytes.length; i++) {
        encrypted[i] = bytes[i] ^ keyBytes[i % keyBytes.length];
      }
      let binary = '';
      encrypted.forEach(b => binary += String.fromCharCode(b));
      return btoa(binary);
    }

    function getTodayYYMMDD() {
      const now = new Date();
      const yy = String(now.getFullYear()).slice(-2);
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const dd = String(now.getDate()).padStart(2, '0');
      return `${yy}${mm}${dd}`;
    }

    function yymmddToLabel(yymmdd) {
      const mm = parseInt(yymmdd.slice(2, 4), 10);
      const dd = parseInt(yymmdd.slice(4, 6), 10);
      return `${mm}月${dd}日`;
    }

    function getCounter() {
      const raw = localStorage.getItem(COUNTER_KEY);
      if (!raw) return { date: '', maxCounter: 0 };
      try {
        const parsed = JSON.parse(raw);
        return { date: parsed.date || '', maxCounter: parsed.maxCounter || 0 };
      } catch {
        return { date: '', maxCounter: 0 };
      }
    }

    function setCounter(date, maxCounter) {
      localStorage.setItem(COUNTER_KEY, JSON.stringify({ date, maxCounter }));
    }

    function updateStatus() {
      const today = getTodayYYMMDD();
      const stored = getCounter();
      const statusDiv = document.getElementById('status');
      const startInput = document.getElementById('startNum');

      if (stored.date === today && stored.maxCounter > 0) {
        statusDiv.textContent = `今天（${yymmddToLabel(today)}）已生成到第 ${stored.maxCounter} 号，下一张建议从第 ${stored.maxCounter + 1} 号开始。`;
        startInput.value = stored.maxCounter + 1;
      } else {
        statusDiv.textContent = `今天（${yymmddToLabel(today)}）尚未生成，默认从第 1 号开始。你可以手动修改起始编号。`;
        startInput.value = 1;
      }
    }

    function resetCounter() {
      if (!confirm('确定要重置今日计数器吗？重置后起始编号回到 1，可能与已发出的票号重复。')) return;
      localStorage.removeItem(COUNTER_KEY);
      updateStatus();
      document.getElementById('qrcode-container').innerHTML = '';
    }

    // 根据屏幕宽度计算二维码尺寸：手机上一行约放两个，桌面封顶 300
    function calcQrSize() {
      const vw = Math.min(window.innerWidth, 800);
      const size = Math.floor(vw * 0.42);          // 约屏宽 42%，一行两个
      return Math.max(130, Math.min(300, size));    // 下限 130，上限 300
    }

    function generateTickets() {
      const startNum = parseInt(document.getElementById('startNum').value, 10);
      const count = parseInt(document.getElementById('count').value, 10);

      if (!startNum || startNum < 1) { alert('请输入有效的起始编号'); return; }
      if (!count || count < 1) { alert('请输入有效的生成数量'); return; }
      if (startNum + count - 1 > 999) {
        alert('编号超过 999，请减小起始编号或生成数量。');
        return;
      }

      const container = document.getElementById('qrcode-container');
      container.innerHTML = '';

      const today = getTodayYYMMDD();
      const stored = getCounter();

      if (stored.date === today && startNum <= stored.maxCounter) {
        const ok = confirm(
          `注意：今天已经生成到第 ${stored.maxCounter} 号，你设置的起始编号 ${startNum} 会与已发出的票号重复。\n\n确定继续吗？`
        );
        if (!ok) return;
      }

      const dateLabel = yymmddToLabel(today);
      const qrSize = calcQrSize();   // 关键：动态尺寸

      let current = startNum;
      for (let i = 0; i < count; i++) {
        const serial = String(current).padStart(3, '0');
        const ticketId = `Utopia_${today}_${serial}`;
        const encrypted = encrypt(ticketId);

        const ticketDiv = document.createElement('div');
        ticketDiv.className = 'ticket';

        const qrDiv = document.createElement('div');
        ticketDiv.appendChild(qrDiv);

        const label = document.createElement('div');
        label.className = 'ticket-label';
        label.textContent = `${dateLabel}${current}号票`;
        ticketDiv.appendChild(label);

        container.appendChild(ticketDiv);

        new QRCode(qrDiv, {
          text: encrypted,
          width: qrSize,
          height: qrSize,
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });

        current++;
      }

      const newMax = Math.max(stored.date === today ? stored.maxCounter : 0, current - 1);
      setCounter(today, newMax);
      updateStatus();
    }

    updateStatus();
  </script>
</body>
</html>
